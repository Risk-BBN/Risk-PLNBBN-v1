<title>Dashboard Risiko &amp; Kinerja — Masuk</title>
<style>
:root{--brand:#0b5e8e;--ink:#1b2430;--muted:#5f6b7a;--line:#d9e0e8;--bg:#f4f6f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(15,35,60,.08)}
.badge{width:44px;height:44px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,142,.15)}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#c62f2f;font-size:13px;min-height:20px;margin-top:10px}
.foot{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Membuka…"; err.textContent = "";
  try {
    const pw = new TextEncoder().encode(document.getElementById("pw").value);
    const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
                                              base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = "Password salah. Coba lagi.";
    btn.disabled = false; btn.textContent = "Buka dashboard";
    document.getElementById("pw").select();
  }
});
</script>
