<style>
:root{--brand:#0b5e8e;--ink:#1b2430;--muted:#5f6b7a;--line:#dde4ec;--accent:#f2b705}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(242,183,5,.14), transparent 60%),
    radial-gradient(800px 600px at -10% 110%, rgba(19,114,159,.5), transparent 55%),
    linear-gradient(135deg,#072e47,#0b5e8e 60%,#0f6ea6);
  color:var(--ink);font:15px/1.55 "Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:18px;-webkit-font-smoothing:antialiased}
.box{background:#fff;border-radius:18px;padding:34px 32px 26px;width:100%;max-width:410px;box-shadow:0 24px 60px rgba(2,20,36,.45),0 2px 8px rgba(2,20,36,.25)}
.badge{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#0b5e8e,#0f6ea6);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 6px 16px rgba(11,94,142,.35)}
h1{font-size:19.5px;margin:0 0 3px;font-weight:800;letter-spacing:.1px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.5}
label{font-size:12px;font-weight:750;display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.pwrow{position:relative}
input{width:100%;font:inherit;font-size:15px;padding:13px 46px 13px 14px;border:1.5px solid var(--line);border-radius:11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(11,94,142,.14)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:8px;color:#8a96a5;display:flex}
.eye:hover{color:var(--brand)}
button.go{margin-top:16px;width:100%;font:inherit;font-size:15px;font-weight:750;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#0b5e8e,#0f6ea6);color:#fff;cursor:pointer;box-shadow:0 6px 14px rgba(11,94,142,.3);transition:transform .12s,box-shadow .12s}
button.go:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(11,94,142,.38)}
button.go:disabled{opacity:.65;cursor:wait;transform:none}
.err{color:#c62f2f;font-size:13px;min-height:20px;margin-top:11px;font-weight:600}
.foot{font-size:12px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid #eef2f6;display:flex;align-items:center;gap:7px;justify-content:center}
.foot svg{flex:none}
@media (max-width:420px){.box{padding:26px 22px 20px}}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("eye").addEventListener("click", () => {
  const i = document.getElementById("pw");
  i.type = i.type === "password" ? "text" : "password"; i.focus();
});
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Membuka…"; err.textContent = "";
  try {
    const pw = new TextEncoder().encode(document.getElementById("pw").value);
    const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
                                              base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = "Password salah. Coba lagi.";
    btn.disabled = false; btn.textContent = "Buka dashboard";
    document.getElementById("pw").select();
  }
});
